name: "🐞 Error en el sitio"
description: Algo no funciona o se ve mal
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: URL donde ocurre
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: "Android, Chrome 128"
