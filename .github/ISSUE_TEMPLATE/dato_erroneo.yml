name: "❌ Dato erróneo"
description: Reportar información incorrecta de un político, votación o comisión
labels: ["datos", "verificacion"]
body:
  - type: input
    id: url_pulso
    attributes:
      label: Página de Pulso Cívico donde aparece
    validations:
      required: true
  - type: textarea
    id: incorrecto
    attributes:
      label: Dato incorrecto
    validations:
      required: true
  - type: textarea
    id: correcto
    attributes:
      label: Dato correcto
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Enlace a fuente oficial que lo respalda
      description: Sin fuente verificable no se puede corregir.
    validations:
      required: true
